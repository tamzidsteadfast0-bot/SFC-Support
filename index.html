<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Portal</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#0d6efd;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:40px auto;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:10px;
            padding:30px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .card h2{
            margin-bottom:20px;
        }

        .card a{
            display:inline-block;
            text-decoration:none;
            background:#0d6efd;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }

        .card a:hover{
            background:#084298;
        }
    </style>

</head>
<body>

<header>
    IR Support Portal
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>Regular Charge</h2>
            <a href="refund.html">Open</a>
        </div>

        <div class="card">
            <h2>Mango Charge</h2>
            <a href="charge.html">Open</a>
        </div>

        <div class="card">
            <h2>Offline Charge</h2>
            <a href="report.html">Open</a>
        </div>

        <div class="card">
            <h2>Google Sheet</h2>
            <a href="https://docs.google.com/spreadsheets/d/13labODowPDqDPr1WbjXoLfk_cK1wIc2QOOzjxjhBNTY/edit?gid=0#gid=0"
               target="_blank">
               Open Sheet
            </a>
        </div>

    </div>

</div>

</body>
</html>
