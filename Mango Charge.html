<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আম ডেলিভারি চার্জ ক্যালকুলেটর</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --leaf:#3F6B2E;
    --leaf-dark:#2C4B1F;
    --bark:#4A3221;
    --paper:#FFF7E8;
    --paper-deep:#F5E9CE;
    --card:#FFFDF6;
    --mango:#E67E22;
    --mango-deep:#C4650F;
    --gold:#E9A93B;
    --line:#E4D3AC;
    --danger:#B33B2C;
    --radius:16px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Hind Siliguri', Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(63,107,46,0.10), transparent 42%),
      radial-gradient(circle at 90% 92%, rgba(230,126,34,0.12), transparent 46%),
      var(--paper);
    color:var(--bark);
    padding:32px 16px 60px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    width:100%;
    max-width:460px;
  }

  /* ---- Header: orchard crate lid ---- */
  .brandbar{
    position:relative;
    background:var(--leaf-dark);
    color:var(--paper);
    border-radius:var(--radius) var(--radius) 0 0;
    padding:20px 22px 34px;
    overflow:hidden;
  }
  .brandbar::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 3px, transparent 3px 26px),
      repeating-linear-gradient(25deg, rgba(255,255,255,0.03) 0 3px, transparent 3px 26px);
  }
  .brandbar .row{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brandbar .mark{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:19px;
  }
  .brandbar .mark .box{
    width:34px; height:34px;
    border-radius:9px;
    background:var(--mango);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .brandbar .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--gold);
    text-transform:uppercase;
    border:1px solid rgba(233,169,59,0.55);
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .brandbar .sub{
    position:relative;
    z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    color:#BFCBAE;
    margin-top:8px;
  }

  /* jagged crate-lid edge */
  .brandbar .edge{
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:14px;
    background:
      linear-gradient(135deg, var(--leaf-dark) 25%, transparent 25%) 0 50%,
      linear-gradient(225deg, var(--leaf-dark) 25%, transparent 25%) 0 50%;
    background-size:16px 28px;
    background-repeat:repeat-x;
  }

  /* ---- Main card ---- */
  .card{
    background:var(--card);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:26px 22px 22px;
    box-shadow:0 18px 40px -20px rgba(74,50,33,0.28);
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--mango-deep);
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:23px;
    margin:0 0 20px;
    color:var(--bark);
    letter-spacing:-0.01em;
  }

  fieldset{
    border:none;
    margin:0 0 16px;
    padding:0;
  }

  label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#6B5A44;
    margin-bottom:7px;
  }
  label .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px; height:16px;
    border-radius:4px;
    background:var(--paper-deep);
    color:var(--bark);
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:700;
  }

  select, input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:15px;
    font-family:'Hind Siliguri', sans-serif;
    background:var(--paper);
    color:var(--bark);
    transition:border-color .15s ease, box-shadow .15s ease;
    appearance:none;
    -webkit-appearance:none;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%236B5A44' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  select:focus, input:focus{
    outline:none;
    border-color:var(--mango);
    box-shadow:0 0 0 3px rgba(230,126,34,0.15);
  }
  input::placeholder{ color:#B7A886; }

  .weight-row{ position:relative; }
  .weight-row input{ padding-right:52px; }
  .weight-row .unit{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:#6B5A44;
    pointer-events:none;
  }

  button{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:var(--mango);
    color:#fff;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:15.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--mango-deep); }
  button:active{ transform:scale(0.99); }

  /* ---- Result: mango crate stamp ---- */
  .stamp-wrap{
    margin-top:22px;
  }
  .stamp{
    position:relative;
    background:var(--leaf-dark);
    color:var(--paper);
    border-radius:12px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    min-height:34px;
  }
  .stamp .lbl{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#B9C8A6;
    line-height:1.6;
  }
  .stamp .amount{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:27px;
    color:var(--gold);
    white-space:nowrap;
  }
  .stamp .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:#98A987;
    margin-top:3px;
    line-height:1.6;
  }
  .stamp .seal{
    position:absolute;
    top:-11px;
    right:16px;
    width:38px; height:38px;
    border-radius:50%;
    background:var(--mango);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    border:3px solid var(--card);
    transform:rotate(-8deg);
  }
  .stamp.idle{
    background:var(--paper-deep);
    color:#6B5A44;
  }
  .stamp.idle .lbl{ color:#6B5A44; }
  .stamp.idle .amount{ color:#6B5A44; font-size:14px; font-weight:600; }
  .stamp.error{ background:#3A211B; }
  .stamp.error .amount{ color:#F2A79B; font-size:15px; }

  .breakdown{
    margin-top:10px;
    padding:14px 16px;
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:#6B5A44;
    line-height:1.9;
  }
  .breakdown .row{
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .breakdown .note{
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed var(--line);
    color:var(--mango-deep);
    font-size:11px;
  }

  .footer-note{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:#6B5A44;
    letter-spacing:0.03em;
    background:var(--paper-deep);
    border-radius:0 0 var(--radius) var(--radius);
    padding:10px 20px;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="brandbar">
    <div class="row">
      <div class="mark"><span class="box">🥭</span> আম ডেলিভারি রেট</div>
      <div class="tag">Mango Season</div>
    </div>
    <div class="sub">ডেলিভারি রেট শিট</div>
    <div class="edge"></div>
  </div>

  <div class="card">
    <p class="eyebrow">Step 1–3 · এরিয়া ও ওজন</p>
    <h1>আম ডেলিভারি চার্জ ক্যালকুলেটর</h1>

    <fieldset>
      <label><span class="num">1</span>ডেলিভারি এরিয়া</label>
      <select id="location">
        <option value="dhaka_city">ঢাকা সিটি</option>
        <option value="district_city">সারাদেশ (জেলা/সিটি)</option>
        <option value="upazila">সারাদেশ (উপজেলা)</option>
      </select>
    </fieldset>

    <fieldset>
      <label><span class="num">2</span>ডেলিভারির ধরণ</label>
      <select id="delivery_type">
        <option value="point">পয়েন্ট ডেলিভারি</option>
        <option value="home">হোম ডেলিভারি</option>
      </select>
    </fieldset>

    <fieldset>
      <label><span class="num">3</span>ওজন</label>
      <div class="weight-row">
        <input type="number" id="weight" placeholder="যেমন: 15" min="1" step="0.1">
        <span class="unit">KG</span>
      </div>
    </fieldset>

    <button onclick="calculateMangoCharge()">চার্জ হিসাব করুন</button>

    <div class="stamp-wrap">
      <div class="stamp idle" id="result">
        <div>
          <div class="lbl">মোট চার্জ</div>
        </div>
        <div class="amount">এখানে দেখাবে</div>
      </div>
      <div id="breakdown"></div>
    </div>
  </div>

  <div class="footer-note">সব রেট আনুমানিক · মৌসুম ও এরিয়া অনুযায়ী পরিবর্তনযোগ্য</div>

</div>

<script>
function calculateMangoCharge() {
  const location = document.getElementById('location').value;
  const deliveryType = document.getElementById('delivery_type').value;
  const weight = parseFloat(document.getElementById('weight').value);
  const resultDiv = document.getElementById('result');
  const breakdownDiv = document.getElementById('breakdown');

  if (!weight || weight <= 0) {
    resultDiv.className = 'stamp error';
    resultDiv.innerHTML = `<div><div class="lbl">ইনপুট প্রয়োজন</div></div><div class="amount">⚠️ সঠিক ওজন দিন</div>`;
    breakdownDiv.innerHTML = '';
    return;
  }

  let perKgRate = 0;
  let minCharge = 0;

  // Determine Per KG Rate based on weight and location
  if (weight < 20) {
    if (location === 'dhaka_city') {
      perKgRate = (deliveryType === 'point') ? 13 : 22;
    } else if (location === 'district_city') {
      perKgRate = (deliveryType === 'point') ? 16 : 24;
    } else { // upazila
      perKgRate = (deliveryType === 'point') ? 18 : 26;
    }
  } else { // 20 KG or more
    if (location === 'dhaka_city') {
      perKgRate = (deliveryType === 'point') ? 12 : 20;
    } else if (location === 'district_city') {
      perKgRate = (deliveryType === 'point') ? 16 : 22;
    } else { // upazila
      perKgRate = (deliveryType === 'point') ? 16 : 24;
    }
  }

  // Determine Minimum Booking Charge
  if (location === 'dhaka_city') {
    minCharge = (deliveryType === 'point') ? 100 : 120;
  } else { // Outside Dhaka (District/Upazila)
    minCharge = (deliveryType === 'point') ? 120 : 130;
  }

  // Calculate the charge and compare with minimum
  const calculatedCharge = weight * perKgRate;
  const finalCharge = Math.max(calculatedCharge, minCharge);

  // Display the result
  resultDiv.className = 'stamp';
  resultDiv.innerHTML = `
    <div>
      <div class="lbl">মোট ডেলিভারি চার্জ</div>
      <div class="meta">${weight} কেজি · ${perKgRate}৳/কেজি</div>
    </div>
    <div class="amount">৳${Math.ceil(finalCharge)}</div>
    <div class="seal">🥭</div>
  `;

  if (calculatedCharge > minCharge) {
    breakdownDiv.innerHTML = `
      <div class="breakdown">
        <div class="row"><span>ওজন অনুযায়ী চার্জ</span><span>${weight} কেজি × ৳${perKgRate} = ৳${calculatedCharge.toFixed(2)}</span></div>
      </div>
    `;
  } else {
    breakdownDiv.innerHTML = `
      <div class="breakdown">
        <div class="row"><span>ওজন অনুযায়ী চার্জ</span><span>৳${calculatedCharge.toFixed(2)}</span></div>
        <div class="row"><span>সর্বনিম্ন চার্জ</span><span>৳${minCharge}</span></div>
        <div class="note">সর্বনিম্ন চার্জ প্রযোজ্য হওয়ায় চূড়ান্ত চার্জ নির্ধারিত হয়েছে</div>
      </div>
    `;
  }
}
</script>

</body>
</html>
