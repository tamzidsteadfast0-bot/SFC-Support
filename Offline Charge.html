$(document).ready(function() {
    products.sort((a, b) => a.name.localeCompare(b.name, 'bn'));
    
    const productSelect = $('#product');
    
    products.forEach(p => {
        productSelect.append(new Option(p.name, p.id));
    });

    productSelect.select2({
        placeholder: "পণ্যের নাম লিখে সার্চ করুন...",
        allowClear: true,
        width: '100%',
        dropdownParent: $('body')
    });

    productSelect.on('change', function() {
        handleProductChange();
    });
});

function handleProductChange() {
    const productId = $('#product').val();
    const product = products.find(p => p.id === productId);
    const extraInputsDiv = $('#extra-inputs');
    extraInputsDiv.html('');
    $('#result').addClass('hidden');

    if (!product) return;

    if (product.type === 'unit') {
        extraInputsDiv.html(`
            <div class="form-group">
                <label>পরিমাণ (${product.unitName})</label>
                <input type="number" id="quantity" placeholder="যেমন: 10" min="0.1" step="any">
            </div>
        `);
    } else if (product.type === 'location' || product.type === 'location-based-simple') {
        extraInputsDiv.html(`
            <div class="form-group">
                <label>এলাকা</label>
                <select id="sub_location">
                    <option value="zila">জেলা সদর</option>
                    <option value="upazila">উপজেলা</option>
                </select>
            </div>
        `);
    } else if (product.type === 'tiered-location') {
         extraInputsDiv.html(`
            <div class="form-group">
                <label>এলাকা</label>
                <select id="sub_location">
                    <option value="dhaka">ঢাকার মধ্যে</option>
                    <option value="outside_dhaka">ঢাকার বাইরে</option>
                </select>
            </div>
        `);
    } else if (product.type.startsWith('tiered-weight')) {
        extraInputsDiv.html(`
            <div class="form-group">
                <label>ওজন (KG)</label>
                <input type="number" id="weight" placeholder="যেমন: 22" min="0.1" step="any">
            </div>
        `);
    }
}

function calculateCharge() {
    const productId = $('#product').val();
    const deliveryType = $('input[name="deliveryType"]:checked').val();
    const resultDiv = $('#result');

    if (!productId) {
        resultDiv.html("⚠️ অনুগ্রহ করে একটি পণ্য সিলেক্ট করুন।").removeClass('hidden').css('border-left-color', '#ffc107');
        return;
    }

    const product = products.find(p => p.id === productId);
    let charge = 0;
    let description = `${product.name} | ${deliveryType === 'point' ? 'পয়েন্ট' : 'হোম'} ডেলিভারি`;

    try {
        switch(product.type) {
            case 'simple':
                charge = product[deliveryType];
                break;
            
            case 'unit':
                const quantity = parseFloat($('#quantity').val());
                if (!quantity || quantity <= 0) throw new Error(`সঠিক পরিমাণ (${product.unitName}) দিন।`);
                charge = product[deliveryType] * quantity;
                description += ` | পরিমাণ: ${quantity} ${product.unitName}`;
                break;

            case 'location':
                const subLoc = $('#sub_location').val();
                charge = product[deliveryType][subLoc];
                description += ` | এলাকা: ${subLoc === 'zila' ? 'জেলা সদর' : 'উপজেলা'}`;
                break;
            
            case 'location-based-simple':
                const loc = $('#sub_location').val();
                charge = (loc === 'zila') ? product.zila : product.upazila;
                description += ` | এলাকা: ${loc === 'zila' ? 'জেলা সদর' : 'উপজেলা'}`;
                break;
            
            case 'tiered-location':
                const bubbleLoc = $('#sub_location').val();
                if(deliveryType === 'point') charge = (bubbleLoc === 'dhaka') ? 250 : 400;
                else charge = (bubbleLoc === 'dhaka') ? 350 : 500;
                description += ` | এলাকা: ${bubbleLoc === 'dhaka' ? 'ঢাকার মধ্যে' : 'ঢাকার বাইরে'}`;
                break;

            case 'tiered-weight':
                const weight = parseFloat($('#weight').val());
                if (!weight || weight <= 0) throw new Error("সঠিক ওজন (KG) দিন।");
                description += ` | ওজন: ${weight} KG`;
                let foundTier = false;
                for (const tier of product.tiers) {
                    if (weight <= tier.max) {
                        charge = tier.price;
                        foundTier = true;
                        break;
                    }
                }
                if (!foundTier) {
                    if(product.extraPerKg && product.extraStartFrom) {
                         charge = Math.ceil(weight) * product.extraPerKg;
                    } else {
                         charge = product.tiers[product.tiers.length - 1].price;
                    }
                }
                break;

            case 'tiered-weight-special':
                const geoWeight = parseFloat($('#weight').val());
                if (!geoWeight || geoWeight <= 0) throw new Error("সঠিক ওজন (KG) দিন।");
                description += ` | ওজন: ${geoWeight} KG`;
                if(geoWeight <= 5) charge = 100;
                else if(geoWeight <= 10) charge = 220;
                else charge = 220 + (Math.ceil(geoWeight - 10) * 25);
                break;
            
            case 'tiered-weight-rice':
                const riceWeight = parseFloat($('#weight').val());
                if (!riceWeight || riceWeight <= 0) throw new Error("সঠিক ওজন (KG) দিন।");
                description += ` | ওজন: ${riceWeight} KG`;
                if(riceWeight < 25) charge = 150;
                else charge = 150 + (Math.ceil(riceWeight - 25) * 6);
                break;

            default:
                throw new Error("এই পণ্যের জন্য চার্জ হিসাব করা সম্ভব নয়।");
        }
        
        resultDiv.html(`✅ মোট চার্জ: <b>৳${Math.ceil(charge)}</b><br><small>${description}</small>`).removeClass('hidden').css('border-left-color', '#28a745');

    } catch (e) {
        resultDiv.html(`⚠️ ${e.message}`).removeClass('hidden').css('border-left-color', '#dc3545');
    }
}
</script>

</body>
</html>
